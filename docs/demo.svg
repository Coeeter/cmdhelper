<svg xmlns="http://www.w3.org/2000/svg" width="648" height="600" viewBox="0 0 648 600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">
<rect width="648" height="600" rx="10" fill="#0d1117"/>
<rect width="648" height="38" rx="10" fill="#161b22"/>
<rect y="28" width="648" height="10" fill="#161b22"/>
<circle cx="20" cy="19" r="6" fill="#ff5f57"/>
<circle cx="40" cy="19" r="6" fill="#febc2e"/>
<circle cx="60" cy="19" r="6" fill="#28c840"/>
<text x="82" y="24" fill="#8b949e">cmdhelper</text>
<text x="22" y="58" fill="#7ee787" xml:space="preserve">$ cmdhelper --help</text>
<text x="22" y="98" fill="#c9d1d9" xml:space="preserve">An AI-powered CLI helper for generating commands</text>
<text x="22" y="138" fill="#79c0ff" xml:space="preserve">Usage:</text>
<text x="22" y="158" fill="#c9d1d9" xml:space="preserve">  cmdhelper [command]</text>
<text x="22" y="198" fill="#79c0ff" xml:space="preserve">Available Commands:</text>
<text x="22" y="218" fill="#c9d1d9" xml:space="preserve">  completion  Generate the autocompletion script for the specified shell</text>
<text x="22" y="238" fill="#c9d1d9" xml:space="preserve">  config      Manage configuration</text>
<text x="22" y="258" fill="#c9d1d9" xml:space="preserve">  generate    Generate a command based on a prompt</text>
<text x="22" y="278" fill="#c9d1d9" xml:space="preserve">  help        Help about any command</text>
<text x="22" y="318" fill="#79c0ff" xml:space="preserve">Flags:</text>
<text x="22" y="338" fill="#8b949e" xml:space="preserve">  -h, --help   help for cmdhelper</text>
<text x="22" y="378" fill="#c9d1d9" xml:space="preserve">Use &quot;cmdhelper [command] --help&quot; for more information about a command.</text>
<text x="22" y="418" fill="#7ee787" xml:space="preserve">$ cmdhelper generate --help</text>
<text x="22" y="458" fill="#c9d1d9" xml:space="preserve">Generate a command based on a prompt</text>
<text x="22" y="498" fill="#79c0ff" xml:space="preserve">Usage:</text>
<text x="22" y="518" fill="#c9d1d9" xml:space="preserve">  cmdhelper generate [prompt] [flags]</text>
<text x="22" y="558" fill="#79c0ff" xml:space="preserve">Flags:</text>
<text x="22" y="578" fill="#8b949e" xml:space="preserve">  -h, --help   help for generate</text>
</svg>